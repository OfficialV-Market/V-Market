<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders | V-Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#172033;
    padding-bottom:30px;
}

.header{
    background:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:900;
    color:#10243e;
    text-decoration:none;
}

.logo span{
    color:#ff6b00;
}

.back{
    color:#ff6b00;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px 40px;
}

h1{
    margin-bottom:20px;
}

.order-card{
    background:#fff;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    border-bottom:1px solid #eee;
    padding-bottom:13px;
}

.order-id{
    font-weight:bold;
    color:#10243e;
}

.status{
    background:#fff3e6;
    color:#ff6b00;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.order-date{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #f0f0f0;
}

.item-name{
    font-weight:600;
}

.item-qty{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.item-price{
    font-weight:bold;
}

.order-total{
    display:flex;
    justify-content:space-between;
    padding-top:14px;
    font-size:19px;
    font-weight:bold;
}

.address{
    background:#f7f8fa;
    padding:13px;
    border-radius:10px;
    margin-top:14px;
    font-size:13px;
    line-height:1.6;
}

.payment{
    margin-top:10px;
    font-size:13px;
    color:#555;
}

.empty{
    background:#fff;
    padding:60px 20px;
    text-align:center;
    border-radius:16px;
}

.empty-icon{
    font-size:55px;
    margin-bottom:12px;
}

.shop-btn{
    display:inline-block;
    margin-top:18px;
    padding:12px 22px;
    background:#ff6b00;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

@media(max-width:600px){

    .order-top{
        align-items:flex-start;
    }

    .order-id{
        font-size:14px;
    }

}
</style>
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        <span>V</span>-MARKET
    </a>

    <a href="products.html" class="back">
        ← Shopping
    </a>

</header>

<main class="container">

    <h1>📦 My Orders</h1>

    <div id="orders"></div>

</main>

<script>

function getOrders(){

    return JSON.parse(
        localStorage.getItem("vmarket_orders") || "[]"
    );

}


function renderOrders(){

    const orders = getOrders();

    const container =
        document.getElementById("orders");


    if(orders.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h2>No Orders Yet</h2>

                <p style="color:#777;margin-top:8px;">
                    आपने अभी तक कोई order नहीं किया है।
                </p>

                <a
                    href="products.html"
                    class="shop-btn">
                    Start Shopping
                </a>

            </div>

        `;

        return;
    }


    /*
      Latest order पहले दिखेगा
    */

    const sortedOrders =
        [...orders].reverse();


    container.innerHTML =
        sortedOrders.map(order => {


            const date =
                new Date(order.createdAt);


            const formattedDate =
                date.toLocaleString("en-IN",{
                    day:"2-digit",
                    month:"short",
                    year:"numeric",
                    hour:"2-digit",
                    minute:"2-digit"
                });


            const itemsHTML =
                order.items.map(item => `

                    <div class="item">

                        <div>

                            <div class="item-name">
                                ${item.name}
                            </div>

                            <div class="item-qty">
                                Quantity:
                                ${item.quantity || 1}
                            </div>

                        </div>

                        <div class="item-price">
                            ₹${(
                                Number(item.price) *
                                Number(item.quantity || 1)
                            ).toLocaleString("en-IN")}
                        </div>

                    </div>

                `).join("");


            return `

                <div class="order-card">

                    <div class="order-top">

                        <div>

                            <div class="order-id">
                                Order ID:
                                ${order.orderId}
                            </div>

                            <div class="order-date">
                                ${formattedDate}
                            </div>

                        </div>

                        <div class="status">
                            ${order.status}
                        </div>

                    </div>


                    <div style="margin-top:5px;">

                        ${itemsHTML}

                    </div>


                    <div class="order-total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${Number(order.total)
                                .toLocaleString("en-IN")}
                        </span>

                    </div>


                    <div class="payment">

                        💳 Payment:
                        ${
                            order.paymentMethod === "cod"
                            ? "Cash on Delivery"
                            : "Online Payment"
                        }

                    </div>


                    <div class="address">

                        <strong>
                            📍 Delivery Address
                        </strong>

                        <br>

                        ${order.customer.name}

                        <br>

                        ${order.customer.address},
                        ${order.customer.city},
                        ${order.customer.state}
                        - ${order.customer.pincode}

                        <br>

                        📱 ${order.customer.mobile}

                    </div>

                </div>

            `;

        }).join("");

}


renderOrders();

</script>

</body>
</html>
